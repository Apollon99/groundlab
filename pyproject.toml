[project]
name = "groundlab"
version = "0.1.0"
description = "Reproducible benchmark of sparse, dense, hybrid and reranked retrieval on SciFact and NFCorpus."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.11.*"
# Direct dependencies are pinned exactly; transitive pins and hashes live in uv.lock.
dependencies = [
    "bm25s==0.3.16",
    "PyStemmer==3.1.0",
    "numpy==2.4.6",
    "pytrec-eval-terrier==0.5.11",
    "psutil==7.1.3",
    "torch==2.11.0",
    "transformers==5.22.2",
    "huggingface-hub==2.4.0",
    "safetensors==0.8.0",
    "tokenizers==0.23.3",
]

[project.scripts]
groundlab = "groundlab.cli:main"

[dependency-groups]
dev = [
    "editables==0.5",  # runtime import hook for the dev-mode-exact editable install
    "pytest==8.4.2",
    "ruff==0.14.5",
    "mypy==1.18.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundlab"]
# Python 3.11 decodes .pth files with the locale codec, so a plain path .pth breaks
# when the repo path is non-ASCII (e.g. a Windows user folder with "Ö"). The exact
# dev mode writes the path into a Python module instead, which is always UTF-8.
dev-mode-exact = true

# CUDA 12.8 PyTorch wheels for Windows and Linux. `explicit = true` means only
# torch is resolved from this index; everything else comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "cuda: test needs a CUDA GPU (skipped otherwise, never silently run on CPU)",
    "pinned_models: test needs the pinned model files from `groundlab models fetch` (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/groundlab/data/specs.py" = ["E501"]  # pinned 64-char hashes on one line each
"src/groundlab/models.py" = ["E501"]  # pinned 64-char hashes on one line each

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["groundlab"]

[[tool.mypy.overrides]]
module = ["bm25s.*", "Stemmer.*", "pytrec_eval.*", "psutil.*", "torch.*"]
ignore_missing_imports = true
