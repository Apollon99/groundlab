# Hybrid arm (D-018, D-027): RRF k=60 over the BM25 and dense top-100 of the parent configs
# named below (same directory). No padding; fixed, not tuned.
[experiment]
name = "hybrid_scifact_beir"
description = "RRF (k=60) of BM25 and bge-small-en-v1.5 top-100 on SciFact with BEIR qrels."

[dataset]
name = "scifact"
view = "beir"

[retriever]
kind = "hybrid"
fusion = "rrf"
rrf_k = 60
parent_depth = 100
bm25_config = "bm25_scifact_beir.toml"
dense_config = "dense_scifact_beir.toml"

[run]
depth = 100
latency_warmup = 10

[evaluation]
metrics = ["ndcg@10", "recall@10", "recall@100", "mrr@10"]
